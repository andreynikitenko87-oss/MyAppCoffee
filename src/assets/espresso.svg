<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Cup -->
  <rect x="40" y="120" width="120" height="120" fill="#E8D4C4" stroke="#8B4513" stroke-width="2" rx="5"/>

  <!-- Cup handle -->
  <path d="M 160 140 Q 200 140 200 180 Q 200 220 160 220" fill="none" stroke="#8B4513" stroke-width="3"/>

  <!-- Espresso (dark coffee) -->
  <rect x="45" y="125" width="110" height="110" fill="#2C1810" rx="3"/>

  <!-- Crema foam on top -->
  <ellipse cx="100" cy="130" rx="55" ry="12" fill="#D4A574" opacity="0.8"/>

  <!-- Saucer -->
  <ellipse cx="100" cy="245" rx="70" ry="15" fill="#E8D4C4" stroke="#8B4513" stroke-width="2"/>

  <!-- Label -->
  <text x="100" y="280" font-size="18" font-weight="bold" text-anchor="middle" fill="#8B4513">ESPRESSO</text>
</svg>

